<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Links work for TechnoPanic</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://unpkg.com/three@0.95.0/examples/js/libs/inflate.min.js"></script>

  <style>
    .a-loader-title {
       -moz-user-select: none;
       -khtml-user-select: none;
       -webkit-user-select: none;
       -ms-user-select: none;
       user-select: none;
    }
  </style>
  </head>

  <body>
    <!-- Update src in a-assets-->
    <a-scene embedded arjs="debugUIEnabled: false"
             vr-mode-ui="enabled: false"
             loading-screen="dotsColor: #f2ff00; backgroundColor: black;"
             renderer="logarithmicDepthBuffer: true">
      <a-assets timeout="10000">

        <a-asset-item
          id="sculpture"
          src="assets/try1.glb"
        ></a-asset-item>

      </a-assets>

      <!-- Update value -->
      <a-text value="TRYONE, powered by Gallery Gallery 2026" position="-2 -1 -10" color="white" scale="0.9 0.9 0.9" ></a-text>


      <a-entity
        gltf-model="#sculpture"
        animation-mixer
        scale="4 4 4"
        rotation="0 0 0"
        position="0 -3 -5" 
        animation="property: rotation; to: 0 360 0; dur: 0; easing: linear; loop: true"
        animation mixer=”repeat: 1”
      ></a-entity>



      <a-entity light="type: directional;
                   castShadow: true;
                   intensity: 1.3;
                   shadowCameraVisible: false;"
            position="-1 1 3"
                target="#sculpture">
      </a-entity>
      </a-entity>
      <a-entity camera look-controls position="0 1.6 0"></a-entity>

    </a-scene>
  </body>
</html>
